<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - Batallas Pokémon</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base-pokemon.css') }}">
    
    {% block styles %}
    {% endblock %}

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Ubuntu:wght@400;700&display=swap"
        rel="stylesheet">

</head>

<body class="main-layout">

    <div class="background-effects">
        <div class="blob blob-blue"></div>
        <div class="blob blob-red"></div>
        <div class="blob blob-yellow"></div>
    </div>

    {% block header %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-container">
        <div class="footer-card">
            <span><span class="label label-project">Project:</span><span> batalla-pokemon-martinhorjales</span>
            <span class="separator">|</span>
            <span><span class="label label-creator">Created by:</span><span></span> Martín Horjales Monteagudo</span>
            <span class="separator">|</span>
            <span><span class="label label-year">Year of creation:</span><span> 2026</span>
        </div>
    </footer>

</body>

</html>
