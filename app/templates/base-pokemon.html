<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal - Batallas Pokémon</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='css/pagina-principal.css') }}">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Ubuntu:wght@400;700&display=swap"
        rel="stylesheet">

    {% block styles %}
    {% endblock %}
</head>

<body class="min-h-screen flex flex-col justify-center items-center relative p-4">

    <div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-20 pointer-events-none">
        <div class="absolute top-10 left-10 w-32 h-32 bg-blue-500 rounded-full blur-3xl mix-blend-screen"></div>
        <div class="absolute bottom-10 right-10 w-48 h-48 bg-red-500 rounded-full blur-3xl mix-blend-screen"></div>
        <div
            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-yellow-500 rounded-full blur-3xl mix-blend-screen opacity-10">
        </div>
    </div>

    {% block header %}{% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer
        class="w-full text-center z-10 mt-16 md:absolute md:bottom-6 md:mt-0 text-xs md:text-sm text-gray-300 font-medium tracking-wide">
        <div
            class="bg-gray-900/60 backdrop-blur-md border border-gray-700/50 rounded-2xl md:rounded-full px-4 md:px-6 py-3 inline-flex flex-col md:flex-row items-center justify-center gap-2 md:gap-0 shadow-[0_0_15px_rgba(0,0,0,0.5)] pointer-events-auto">
            <span><span class="text-yellow-400 font-bold">Project:</span> {{nombre_proyecto}}</span>
            <span class="hidden md:inline mx-3 text-gray-600">|</span>
            <span><span class="text-blue-400 font-bold">Created by:</span> {{nombre}}</span>
            <span class="hidden md:inline mx-3 text-gray-600">|</span>
            <span><span class="text-red-400 font-bold">Year of creation:</span> {{año}}</span>
        </div>
    </footer>

</body>

</html>
