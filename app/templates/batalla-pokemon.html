{% extends "base-pokemon.html"%}

{% block styles %}
<style>
    .pixel-font {
        font-family: 'Press Start 2P', monospace;
    }

    .hp-bar-fill {
        transition: width 0.5s ease-in-out;
    }
</style>
{% endblock %}

{% block header %}
<header class="w-full max-w-5xl text-center mt-4">
    <h2 class="text-yellow-400 font-bold uppercase tracking-widest text-lg md:text-xl drop-shadow-md"
        style="font-family: 'Bangers', cursive; letter-spacing: 2px;">
        Trainer <span class="text-white text-2xl">ASH</span> vs Rival!
    </h2>
</header>
{% endblock %}

{% block content %}
<main
    class="w-full max-w-6xl mx-auto relative z-10 border-2 border-gray-700/80 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.8)] mt-4 bg-cover bg-center bg-no-repeat overflow-hidden h-[450px] md:h-[600px]"
    style="background-image: linear-gradient(rgba(17, 24, 39, 0.4), rgba(17, 24, 39, 0.4)), url('{{ url_for('static', filename='img/fondo-batalla-pokemon.jpg') }}');">

    <div class="absolute top-6 left-6 md:top-10 md:left-10 z-30">
        <div class="bg-gray-100/90 border-4 border-gray-800 rounded-xl p-3 md:p-5 shadow-lg w-64 md:w-80 transform -skew-x-6">
            <div class="flex justify-between items-center mb-2 transform skew-x-6">
                <span class="text-gray-900 font-bold uppercase pixel-font text-[10px] md:text-sm">
                    CHARIZARD
                </span>
                <span class="text-gray-900 font-bold pixel-font text-[10px] md:text-xs">Lv20</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-3 md:h-4 border-2 border-gray-900 transform skew-x-6 overflow-hidden mb-2">
                <div class="bg-green-500 h-full hp-bar-fill" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <div class="absolute top-[25%] right-[0%] md:top-[10%] md:right-[30%] z-10 flex flex-col items-center">
        <div class="absolute bottom-0 w-24 md:w-48 h-6 md:h-10 bg-black/40 rounded-[100%] filter blur-sm"></div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/6.gif"
            alt="Rival Pokemon" class="w-24 md:w-56 h-auto object-contain drop-shadow-2xl relative z-10" />
    </div>

    <div class="absolute bottom-[20%] left-[25%] md:bottom-[10%] md:left-[15%] z-20 flex flex-col items-center">
        <div class="absolute bottom-0 w-32 md:w-64 h-8 md:h-12 bg-black/50 rounded-[100%] filter blur-sm"></div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/9.gif"
            alt="Player Pokemon" class="w-32 md:w-72 h-auto object-contain drop-shadow-2xl relative z-10" />
    </div>

    <div class="absolute bottom-6 right-6 md:bottom-10 md:right-10 z-30">
        <div class="bg-gray-100/90 border-4 border-gray-800 rounded-xl p-3 md:p-5 shadow-lg w-64 md:w-80 transform -skew-x-6">
            <div class="flex justify-between items-center mb-2 transform skew-x-6">
                <span class="text-gray-900 font-bold uppercase pixel-font text-[10px] md:text-sm">
                    BLASTOISE
                </span>
                <span class="text-gray-900 font-bold pixel-font text-[10px] md:text-xs">Lv20</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-3 md:h-4 border-2 border-gray-900 transform skew-x-6 overflow-hidden mb-2">
                <div class="bg-green-500 h-full hp-bar-fill" style="width: 100%;"></div>
            </div>
            <div class="text-right text-gray-800 font-bold pixel-font text-[9px] transform skew-x-6">
                60 / 60 HP
            </div>
        </div>
    </div>
</main>

<div class="w-full max-w-6xl mx-auto mt-6 mb-24 z-10 flex-shrink-0 relative">
    <div class="bg-gray-900/80 border-4 border-gray-700 p-4 md:p-6 rounded-xl shadow-[0_0_20px_rgba(0,0,0,0.5)]">
        <h3 class="text-white pixel-font text-xs md:text-sm mb-4 md:mb-6 text-center">What will you do?</h3>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-6">

            <button
                class="bg-blue-600 hover:bg-blue-500 border-2 border-blue-400 text-white rounded-lg p-3 md:p-5 transition-all hover:scale-105 active:scale-95 shadow-md group">
                <span class="pixel-font text-[10px] md:text-xs uppercase drop-shadow-md group-hover:text-yellow-300">
                    Hydro Pump
                </span>
            </button>

            <button
                class="bg-gray-600 hover:bg-gray-500 border-2 border-gray-400 text-white rounded-lg p-3 md:p-5 transition-all hover:scale-105 active:scale-95 shadow-md group">
                <span class="pixel-font text-[10px] md:text-xs uppercase drop-shadow-md group-hover:text-yellow-300">
                    Skull Bash
                </span>
            </button>

            <button
                class="bg-cyan-600 hover:bg-cyan-500 border-2 border-cyan-400 text-white rounded-lg p-3 md:p-5 transition-all hover:scale-105 active:scale-95 shadow-md group">
                <span class="pixel-font text-[10px] md:text-xs uppercase drop-shadow-md group-hover:text-yellow-300">
                    Ice Beam
                </span>
            </button>

            <button
                class="bg-purple-700 hover:bg-purple-600 border-2 border-purple-400 text-white rounded-lg p-3 md:p-5 transition-all hover:scale-105 active:scale-95 shadow-md group">
                <span class="pixel-font text-[10px] md:text-xs uppercase drop-shadow-md group-hover:text-yellow-300">
                    Bite
                </span>
            </button>
        </div>
    </div>
</div>
{% endblock %}
