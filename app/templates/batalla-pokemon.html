{% extends "base-pokemon.html"%}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/batalla-pokemon.css') }}">
{% endblock %}

{% block header %}
<header class="battle-scene-header">
    <h2 class="battle-scene-title">
        Trainer <span class="trainer-name-highlight">ASH</span> vs Rival!
    </h2>
</header>
{% endblock %}

{% block content %}
<main class="battle-stage"
    style="background-image: linear-gradient(rgba(17, 24, 39, 0.4), rgba(17, 24, 39, 0.4)), url('{{ url_for('static', filename='img/fondo-batalla-pokemon.jpg') }}');">

    <!-- HUD Rival -->
    <div class="hud-container hud-rival">
        <div class="hud-box">
            <div class="hud-header skew-reverse">
                <span class="hud-name pixel-font">CHARIZARD</span>
                <span class="hud-level pixel-font">Lv20</span>
            </div>
            <div class="hp-bar-container skew-reverse">
                <div class="hp-bar-fill" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <div class="sprite-wrapper sprite-rival">
        <div class="sprite-shadow shadow-rival"></div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/6.gif"
            alt="Rival Pokemon" class="sprite-img img-rival" />
    </div>

    <div class="sprite-wrapper sprite-player">
        <div class="sprite-shadow shadow-player"></div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/back/9.gif"
            alt="Player Pokemon" class="sprite-img img-player" />
    </div>

    <div class="hud-container hud-player">
        <div class="hud-box">
            <div class="hud-header skew-reverse">
                <span class="hud-name pixel-font">BLASTOISE</span>
                <span class="hud-level pixel-font">Lv20</span>
            </div>
            <div class="hp-bar-container skew-reverse">
                <div class="hp-bar-fill" style="width: 100%;"></div>
            </div>
            <div class="hud-hp-text pixel-font skew-reverse">
                60 / 60 HP
            </div>
        </div>
    </div>
</main>

<div class="action-menu-wrapper">
    <div class="action-menu-box">
        <h3 class="action-menu-title pixel-font">What will you do?</h3>

        <div class="moves-grid">

            <button class="move-btn move-water">
                <span class="move-btn-text pixel-font">Hydro Pump</span>
            </button>

            <button class="move-btn move-normal">
                <span class="move-btn-text pixel-font">Skull Bash</span>
            </button>

            <button class="move-btn move-ice">
                <span class="move-btn-text pixel-font">Ice Beam</span>
            </button>

            <button class="move-btn move-dark">
                <span class="move-btn-text pixel-font">Bite</span>
            </button>

        </div>
    </div>
</div>
{% endblock %}
