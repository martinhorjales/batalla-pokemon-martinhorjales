<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Pokémon - Batallas Pokémon</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            /* Dynamic animated gradient background */
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #172554);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Ubuntu', sans-serif;
            overflow-x: hidden;
            color: white;
        }

        .title-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
            line-height: 1.5;
        }

        /* Utilidad para el efecto de sombra en textos retro */
        .text-shadow-custom {
            text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* Animación para el hover de las tarjetas */
        .card-hover:hover {
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6); /* Glow amarillo */
            border-color: #facc15;
            transform: translateY(-5px) scale(1.02);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative pb-24">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 opacity-20 pointer-events-none">
        <div class="absolute top-10 left-10 w-32 h-32 bg-blue-500 rounded-full blur-3xl mix-blend-screen"></div>
        <div class="absolute bottom-10 right-10 w-48 h-48 bg-red-500 rounded-full blur-3xl mix-blend-screen"></div>
    </div>

    <header class="w-full max-w-7xl mx-auto pt-8 pb-4 px-6 flex flex-col md:flex-row items-center justify-between z-10 gap-4">
        <!-- Botón para volver al Index -->
        <a href="/" class="text-gray-400 hover:text-yellow-400 transition-colors pixel-font text-[10px] md:text-xs flex items-center gap-2 self-start md:self-center">
            <span>&lt;</span> VOLVER
        </a>
        
        <!-- Título -->
        <h1 class="title-font text-5xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 via-yellow-400 to-yellow-600 filter drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] text-center">
            Listado de Pokémon
        </h1>
        
        <!-- Espaciador invisible para centrar el título en desktop -->
        <div class="hidden md:block w-20"></div>
    </header>

    <main class="w-full max-w-7xl mx-auto px-6 py-8 z-10 flex-grow">
        
        <!-- Contenedor GRID: Muestra 1 columna en móvil, 2 en tablets, 3 o 4 en pantallas grandes -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 md:gap-8">

            <!-- ========================================================================= -->
            <!-- INICIO ELEMENTO REPETIBLE (Iterar aquí con Thymeleaf, Vue, React, JSON) -->
            <!-- La tarjeta es un tag <a> para que todo el bloque sea clickable hacia detalles -->
            <!-- ========================================================================= -->
            <a href="/pokemons/detalles/4" class="card-hover bg-gray-900/80 backdrop-blur-sm border-2 border-gray-700 rounded-2xl p-5 flex flex-col items-center transition-all duration-300 relative overflow-hidden group">
                
                <!-- ID del Pokémon (Esquina superior izquierda) -->
                <span class="absolute top-3 left-4 text-gray-500 pixel-font text-[10px] font-bold z-10">
                    #004
                </span>

                <!-- Imagen del Pokémon (Usando Official Artwork para mejor resolución en cards) -->
                <div class="w-full h-32 flex justify-center items-center mt-4 mb-4 relative z-10">
                    <!-- Círculo difuminado de fondo para dar contraste -->
                    <div class="absolute w-24 h-24 bg-white/5 rounded-full blur-md"></div>
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" 
                         alt="Charmander" 
                         class="h-full object-contain drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-300 z-10" />
                </div>

                <!-- Nombre del Pokémon -->
                <h2 class="text-xl font-bold text-white mb-4 z-10 font-['Ubuntu'] uppercase tracking-widest">
                    Charmander
                </h2>

                <!-- Tipos del Pokémon -->
                <div class="flex flex-wrap justify-center gap-2 z-10 w-full mt-auto">
                    <!-- Píldora de Tipo (Ej: Fuego) -->
                    <span class="bg-red-500/20 text-red-400 border border-red-500/50 text-[9px] pixel-font px-3 py-1.5 rounded-full text-shadow-custom shadow-[0_0_8px_rgba(239,68,68,0.3)]">
                        FUEGO
                    </span>
                    <!-- Si tuviera otro tipo, se añadiría aquí. Ej: Volador -->
                </div>
            </a>
            <!-- ========================================================================= -->
            <!-- FIN ELEMENTO REPETIBLE -->
            <!-- ========================================================================= -->


            <!-- EJEMPLO 2: Squirtle (Solo para previsualizar el diseño del Grid) -->
            <a href="/pokemons/detalles/7" class="card-hover bg-gray-900/80 backdrop-blur-sm border-2 border-gray-700 rounded-2xl p-5 flex flex-col items-center transition-all duration-300 relative overflow-hidden group">
                <span class="absolute top-3 left-4 text-gray-500 pixel-font text-[10px] font-bold z-10">#007</span>
                <div class="w-full h-32 flex justify-center items-center mt-4 mb-4 relative z-10">
                    <div class="absolute w-24 h-24 bg-white/5 rounded-full blur-md"></div>
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/7.png" alt="Squirtle" class="h-full object-contain drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-300 z-10" />
                </div>
                <h2 class="text-xl font-bold text-white mb-4 z-10 font-['Ubuntu'] uppercase tracking-widest">Squirtle</h2>
                <div class="flex flex-wrap justify-center gap-2 z-10 w-full mt-auto">
                    <span class="bg-blue-500/20 text-blue-400 border border-blue-500/50 text-[9px] pixel-font px-3 py-1.5 rounded-full text-shadow-custom shadow-[0_0_8px_rgba(59,130,246,0.3)]">
                        AGUA
                    </span>
                </div>
            </a>

            <!-- EJEMPLO 3: Bulbasaur -->
            <a href="/pokemons/detalles/1" class="card-hover bg-gray-900/80 backdrop-blur-sm border-2 border-gray-700 rounded-2xl p-5 flex flex-col items-center transition-all duration-300 relative overflow-hidden group">
                <span class="absolute top-3 left-4 text-gray-500 pixel-font text-[10px] font-bold z-10">#001</span>
                <div class="w-full h-32 flex justify-center items-center mt-4 mb-4 relative z-10">
                    <div class="absolute w-24 h-24 bg-white/5 rounded-full blur-md"></div>
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" alt="Bulbasaur" class="h-full object-contain drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-300 z-10" />
                </div>
                <h2 class="text-xl font-bold text-white mb-4 z-10 font-['Ubuntu'] uppercase tracking-widest">Bulbasaur</h2>
                <div class="flex flex-wrap justify-center gap-2 z-10 w-full mt-auto">
                    <span class="bg-green-500/20 text-green-400 border border-green-500/50 text-[9px] pixel-font px-3 py-1.5 rounded-full text-shadow-custom shadow-[0_0_8px_rgba(34,197,94,0.3)]">
                        PLANTA
                    </span>
                    <span class="bg-purple-500/20 text-purple-400 border border-purple-500/50 text-[9px] pixel-font px-3 py-1.5 rounded-full text-shadow-custom shadow-[0_0_8px_rgba(168,85,247,0.3)]">
                        VENENO
                    </span>
                </div>
            </a>

            <!-- EJEMPLO 4: Pikachu -->
            <a href="/pokemons/detalles/25" class="card-hover bg-gray-900/80 backdrop-blur-sm border-2 border-gray-700 rounded-2xl p-5 flex flex-col items-center transition-all duration-300 relative overflow-hidden group">
                <span class="absolute top-3 left-4 text-gray-500 pixel-font text-[10px] font-bold z-10">#025</span>
                <div class="w-full h-32 flex justify-center items-center mt-4 mb-4 relative z-10">
                    <div class="absolute w-24 h-24 bg-white/5 rounded-full blur-md"></div>
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" alt="Pikachu" class="h-full object-contain drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-300 z-10" />
                </div>
                <h2 class="text-xl font-bold text-white mb-4 z-10 font-['Ubuntu'] uppercase tracking-widest">Pikachu</h2>
                <div class="flex flex-wrap justify-center gap-2 z-10 w-full mt-auto">
                    <span class="bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 text-[9px] pixel-font px-3 py-1.5 rounded-full text-shadow-custom shadow-[0_0_8px_rgba(234,179,8,0.3)]">
                        ELÉCTRICO
                    </span>
                </div>
            </a>

        </div>

    </main>

    <!-- Footer fijo en la parte inferior al igual que en la página principal -->
    <footer class="w-full text-center z-10 absolute bottom-6 text-xs md:text-sm text-gray-300 font-medium tracking-wide pointer-events-none">
        <div class="bg-gray-900/60 backdrop-blur-md border border-gray-700/50 rounded-2xl md:rounded-full px-4 md:px-6 py-3 inline-flex flex-col md:flex-row items-center justify-center gap-2 md:gap-0 shadow-[0_0_15px_rgba(0,0,0,0.5)] pointer-events-auto">
            <span><span class="text-yellow-400 font-bold">Proyecto:</span> Batallas Pokémon</span>
            <span class="hidden md:inline mx-3 text-gray-600">|</span>
            <span><span class="text-blue-400 font-bold">Creado por:</span> Martín Horjales Monteagudo</span>
            <span class="hidden md:inline mx-3 text-gray-600">|</span>
            <span><span class="text-red-400 font-bold">Año de creación:</span> 2026</span>
        </div>
    </footer>

</body>
</html>
