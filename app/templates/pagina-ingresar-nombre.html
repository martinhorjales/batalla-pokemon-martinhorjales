{% extends "base-pokemon.html" %}

{% block content %}
<main class="w-full max-w-4xl mx-auto flex flex-col items-center justify-center space-y-10 z-10">

        <header class="text-center space-y-4">
            <span class="text-yellow-400 font-bold uppercase tracking-widest text-sm md:text-base mb-2 block">
                ♦ NEW CHALLENGER APPROACHING ♦
            </span>
            <h1
                class="title-font text-5xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 via-yellow-400 to-yellow-600 filter drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] pb-2">
                Identify Yourself!
            </h1>
            <p class="text-gray-300 text-lg md:text-xl max-w-xl mx-auto mt-4 drop-shadow-md font-ubuntu">
                Every great Pokémon master starts with a name. Tell us yours before entering the arena.
            </p>
        </header>

        <div class="relative floating flex flex-col items-center my-4">
            <div class="absolute bottom-0 w-32 md:w-48 h-8 bg-black/50 rounded-[100%] filter blur-sm"></div>
            <img src="{{ DATOS[0].get('sprites').get('front_shiny') }}" alt="Imagen de {{ DATOS[0].get('name') }}"
                class="h-72 w-auto object-contain drop-shadow-[0_10px_10px_rgba(0,0,0,0.6)] group-hover:scale-110 transition-transform duration-300 z-10" />
        </div>

        <div class="relative w-full max-w-md group">
            <div
                class="absolute -inset-1 bg-gradient-to-r from-red-500 via-yellow-500 to-blue-500 rounded-xl blur opacity-25 group-focus-within:opacity-75 transition duration-500">
            </div>

            <input type="text" name="trainer_name" id="trainer_name" placeholder="ENTER YOUR NAME..." maxlength="15"
                required autocomplete="off"
                class="relative w-full bg-gray-900 border-2 border-gray-700 text-white text-center text-xl md:text-2xl px-6 py-4 rounded-xl focus:outline-none focus:border-yellow-400 placeholder-gray-600 transition-colors uppercase font-bold tracking-widest"
                style="font-family: 'Press Start 2P', monospace; font-size: 1rem;">
        </div>

        <button type="submit"
            class="game-button rounded-full w-64 md:w-80 h-20 md:h-24 flex items-center justify-center group cursor-pointer border-none bg-transparent">
            <span
                class="relative z-20 text-white font-bold text-xl md:text-2xl uppercase tracking-wider text-shadow-custom pt-1 group-hover:text-yellow-300 transition-colors"
                style="font-family: 'Bangers', cursive; letter-spacing: 2px;">
                Continue
            </span>
        </button>
        </form>

    </main>
{% endblock %}
