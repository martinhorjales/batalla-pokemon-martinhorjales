{% extends "base-pokemon.html"%}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pagina-principal.css') }}">
{% endblock %}

{% block content %}
<header class="battle-header">
    <span class="battle-eyebrow">
        ♦ POKÉMON BATTLE ♦
    </span>
    <h1 class="battle-title title-font">
        Enter the Pokémon Arena!
    </h1>
    <p class="battle-subtitle">
        Prepare your team, plan your strategy, and face the strongest trainers in the world.
    </p>
</header>

<div class="battle-arena">

    <div class="pokemon-card floating">
        <div class="pokemon-shadow"></div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/4.gif"
            alt="Charmander Animado" class="pokemon-sprite pokemon-sprite-flipped" />
        <div class="pokemon-level level-red pixel-font">
            Lv. 20
        </div>
    </div>

    <div class="vs-text title-font text-shadow-custom">
        VS
    </div>

    <div class="pokemon-card floating-delayed">
        <div class="pokemon-shadow"></div>
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/showdown/7.gif"
            alt="Squirtle Animado" class="pokemon-sprite" />
        <div class="pokemon-level level-blue pixel-font">
            Lv. 20
        </div>
    </div>

</div>

<div class="button-container">
    <a href="{{ url_for('identificarse') }}" class="game-button start-button">
        <span class="start-button-text text-shadow-custom">
            Start
        </span>
    </a>
</div>
{% endblock %}
